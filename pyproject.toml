[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular3"
version = "3.0.0"
description = "Hierarchy and collective order in adaptive stochastic networks"
readme = "README.md"
license = {text = "All rights reserved"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "pandas",
    "tqdm",
    "pydantic",
    "pyyaml",
    "ipywidgets>=8.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

